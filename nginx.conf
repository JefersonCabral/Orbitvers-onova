events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Disable cache for JS/CSS files to force reload
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # Serve robots.txt and sitemap.xml
        location = /robots.txt {
            access_log off;
            log_not_found off;
            try_files $uri =404;
            add_header Content-Type text/plain;
        }
        
        location = /sitemap.xml {
            access_log off;
            log_not_found off;
            try_files $uri =404;
            add_header Content-Type application/xml;
        }

        # Configuração específica para imagens sociais (WhatsApp/Facebook) - DEVE VIR ANTES da regra genérica
        location = /imagemsocial.png {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Cache-Control "public, max-age=86400" always;
            
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Max-Age "3600" always;
                add_header Content-Length "0" always;
                return 204;
            }
            
            try_files $uri =404;
        }
        
        # Serve /docs from public folder
        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            try_files $uri $uri/ /docs/index.html;
            index index.html;
        }
        
        # Handle /docs without trailing slash (redirect to /docs/)
        location = /docs {
            return 301 /docs/;
        }

        # Rotas para páginas do site (para SEO - substituem rotas com hash)
        location = /sobre {
            try_files /index.html =404;
            add_header X-Page-Route "sobre" always;
        }
        
        location = /contato {
            try_files /index.html =404;
            add_header X-Page-Route "contato" always;
        }
        
        location = /roadmap {
            try_files /index.html =404;
            add_header X-Page-Route "roadmap" always;
        }
        
        location = /privacidade {
            try_files /index.html =404;
            add_header X-Page-Route "privacidade" always;
        }
        
        location = /termos {
            try_files /index.html =404;
            add_header X-Page-Route "termos" always;
        }
        
        location = /lgpd {
            try_files /index.html =404;
            add_header X-Page-Route "lgpd" always;
        }

        # Cache static assets (IMPORTANTE: antes da regra do React Router)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            try_files $uri =404;
        }

        # Handle React Router (deve vir por último)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

